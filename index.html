<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Hadi Bhuiyan — Digital, AI, Enterprise & SaaS. Co-Founder CommEngine, EasyDO.ai, BuildNation. 19+ years experience."/>
<meta property="og:title" content="Hadi Bhuiyan — Digital · AI · SaaS"/>
<meta property="og:url" content="https://mahadib.futuremind.ltd"/>
<title>Hadi Bhuiyan — Digital · AI · SaaS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a1a'/><text y='.85em' font-size='52' x='8' fill='white' font-family='sans-serif' font-weight='bold'>HB</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:'Nunito',sans-serif;cursor:pointer}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #e8e8e8;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;gap:8px}
.nav-brand{font-weight:900;font-size:15px;letter-spacing:-0.5px;background:none;border:none;color:#1a1a1a;padding:0}
.nav-tabs{display:flex;flex-wrap:wrap;gap:2px}
.nav-btn{background:transparent;color:#666;border:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;transition:all .2s}
.nav-btn.active{background:#1a1a1a;color:#fff}

/* PAGE */
.page{max-width:820px;margin:0 auto;padding:80px 24px 60px;display:none}
.page.active{display:block}

/* SECTION TITLE */
.section-title{font-size:28px;font-weight:900;margin:0 0 6px;letter-spacing:-0.5px;color:#1a1a1a}
.section-sub{font-size:16px;color:#666;margin:0 0 28px;font-weight:500}
.sub-label{display:flex;align-items:center;gap:10px;margin:30px 0 16px}
.sub-label h3{font-size:17px;font-weight:800;margin:0;color:#1a1a1a;white-space:nowrap}
.sub-label-line{flex:1;height:1px;background:#e8e8e8}
.lbl{font-size:12px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}

/* CARDS */
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:18px 20px;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 14px rgba(0,0,0,0.06)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
.stat-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 10px;text-align:center}
.stat-val{font-size:24px;font-weight:900;letter-spacing:-1px;color:#1a1a1a}
.stat-lbl{font-size:12px;color:#666;margin-top:3px;font-weight:600}

/* CHIP */
.chip{background:#f5f5f5;border:1px solid #e8e8e8;border-radius:5px;padding:2px 9px;font-size:12px;font-weight:600;color:#666;display:inline-block}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}

/* EXP CARD */
.exp-card{border:1px solid #e8e8e8;border-radius:12px;background:#fff;overflow:hidden;margin-bottom:8px;transition:box-shadow .2s}
.exp-card:hover{box-shadow:0 2px 14px rgba(0,0,0,0.06)}
.exp-header{width:100%;background:none;border:none;padding:15px 18px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.exp-role{font-weight:800;font-size:16px;color:#1a1a1a;margin-bottom:2px}
.exp-org{font-size:14px;color:#666;margin-bottom:6px}
.exp-period{font-size:13px;color:#666;font-weight:600;white-space:nowrap}
.exp-arrow{font-size:14px;color:#aaa;transition:transform .2s;display:block}
.exp-arrow.open{transform:rotate(180deg)}
.exp-body{padding:0 18px 15px;border-top:1px solid #e8e8e8;display:none}
.exp-body.open{display:block}
.exp-body ul{margin:12px 0 0;padding-left:18px}
.exp-body li{font-size:15px;color:#666;line-height:1.7;margin-bottom:5px}
.exp-link{display:inline-block;margin-top:8px;font-size:13px;color:#666;font-weight:700;text-decoration:underline}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.product-card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}
.product-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.07)}
.product-preview{display:block;overflow:hidden;border-bottom:1px solid #e8e8e8;position:relative}
.product-preview img{width:100%;height:170px;object-fit:cover;object-position:top;display:block;transition:transform .35s}
.product-preview:hover img{transform:scale(1.04)}
.preview-badge{position:absolute;top:9px;right:9px;background:rgba(0,0,0,0.55);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px;backdrop-filter:blur(4px)}
.product-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.product-emoji{font-size:22px;margin-bottom:3px}
.product-name{font-weight:900;font-size:17px;color:#1a1a1a}
.product-tag{font-size:13px;color:#666;font-weight:600}
.product-desc{font-size:14px;color:#666;line-height:1.75;margin:0}
.product-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:auto}
.pstat{background:#f5f5f5;border:1px solid #e8e8e8;border-radius:8px;padding:7px 5px;text-align:center}
.pstat-val{font-size:14px;font-weight:800;color:#1a1a1a}
.pstat-lbl{font-size:11px;color:#666;font-weight:600}

/* PROGRAM BANNER */
.prog-banner{background:#1a1a1a;border-radius:16px;padding:26px;margin-bottom:24px;color:#fff}
.prog-banner-tag{display:inline-block;background:rgba(255,255,255,0.1);border-radius:8px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;color:rgba(255,255,255,0.55)}
.prog-banner h3{font-size:22px;font-weight:900;margin:0 0 8px;letter-spacing:-0.5px}
.prog-banner p{font-size:13px;color:rgba(255,255,255,0.6);margin:0 0 20px;line-height:1.6}
.prog-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.prog-stat{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 8px;text-align:center}
.prog-stat-val{font-size:22px;font-weight:900;color:#fff}
.prog-stat-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.7);margin-top:3px}
.prog-stat-sub{font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px;line-height:1.3}

/* FORMAT CARDS */
.format-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.format-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:18px 16px}
.format-num{background:#1a1a1a;color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-left:6px}
.format-title{font-weight:800;font-size:13px;color:#1a1a1a;margin-bottom:3px}
.format-sub{font-size:11px;color:#666;margin-bottom:9px;font-weight:600}
.format-desc{font-size:12px;color:#666;line-height:1.6;margin:0 0 10px}

/* CURRICULUM */
.curr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.curr-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px}
.curr-phase{font-size:10px;font-weight:700;color:#666;margin-bottom:4px}
.curr-title{font-weight:800;font-size:13px;color:#1a1a1a;margin-bottom:10px}
.curr-week{font-size:11px;color:#666;line-height:1.6;margin-bottom:4px;padding-left:9px;border-left:2px solid #e8e8e8}

/* DIFF GRID */
.diff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.diff-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:14px 16px;display:flex;gap:10px}
.diff-num{background:#1a1a1a;color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.diff-t{font-weight:800;font-size:12px;color:#1a1a1a;margin-bottom:3px}
.diff-d{font-size:11px;color:#666;line-height:1.5}

/* PROGRAM PAGE REDESIGN */
.prog-hero{background:#1a1a1a;border-radius:20px;padding:44px 36px;margin-bottom:28px;color:#fff;position:relative;overflow:hidden}
.prog-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,0.03)}
.prog-hero-tag{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:16px}
.prog-hero-title{font-size:48px;font-weight:900;line-height:1.05;letter-spacing:-2px;margin-bottom:20px;color:#fff}
.prog-hero-sub{font-size:15px;color:rgba(255,255,255,0.58);line-height:1.85;margin:0;max-width:600px}
.prog-result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.prog-result-card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:26px;text-align:center}
.prog-result-val{font-size:58px;font-weight:900;letter-spacing:-3px;color:#1a1a1a;line-height:1}
.prog-result-label{font-size:14px;color:#333;font-weight:700;margin-top:8px}
.prog-result-sub{font-size:12px;color:#999;margin-top:6px;line-height:1.5}
.aipa-step{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:32px;margin-bottom:20px;overflow:hidden;position:relative}
.aipa-step-num{font-size:110px;font-weight:900;color:#f2f2f2;line-height:0.85;letter-spacing:-4px;position:absolute;right:24px;top:24px;user-select:none;pointer-events:none}
.aipa-step-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#999;margin-bottom:10px}
.aipa-step-title{font-size:30px;font-weight:900;letter-spacing:-0.8px;color:#1a1a1a;margin-bottom:4px}
.aipa-step-sub{font-size:15px;color:#666;margin-bottom:20px;font-weight:600}
.aipa-step-desc{font-size:15px;color:#444;line-height:1.85;margin-bottom:22px;max-width:620px}
.aipa-step-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.aipa-step-badge{background:#f5f5f5;border:1px solid #e8e8e8;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;color:#1a1a1a}
.prog-sub-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:4px}
.prog-sub-card{background:#f9f9f9;border:1px solid #ededed;border-radius:14px;padding:18px 16px}
.prog-sub-card-num{background:#1a1a1a;color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;margin-bottom:10px}
.prog-sub-title{font-weight:800;font-size:14px;color:#1a1a1a;margin-bottom:5px}
.prog-sub-desc{font-size:12px;color:#666;line-height:1.65}
.prog-phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 20px}
.prog-phase-card{background:#f9f9f9;border:1px solid #ededed;border-radius:14px;padding:18px 16px}
.prog-phase-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:6px}
.prog-phase-title{font-weight:900;font-size:14px;color:#1a1a1a;margin-bottom:10px}
.prog-phase-item{font-size:12px;color:#666;line-height:1.65;padding-left:10px;border-left:2px solid #e0e0e0;margin-bottom:6px}
.prog-impact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 20px}
.prog-impact-card{border-radius:16px;padding:22px 16px;text-align:center}
.prog-impact-card.l1{background:#f9f9f9;border:1px solid #e8e8e8}
.prog-impact-card.l2{background:#eef3ff;border:1px solid #d0dcff}
.prog-impact-card.l3{background:#1a1a1a;border:1px solid #1a1a1a}
.prog-impact-val{font-size:40px;font-weight:900;letter-spacing:-2px;color:#1a1a1a;margin-bottom:4px;line-height:1}
.prog-impact-card.l3 .prog-impact-val{color:#fff}
.prog-impact-label{font-size:13px;font-weight:700;color:#444}
.prog-impact-card.l3 .prog-impact-label{color:rgba(255,255,255,0.65)}
.prog-impact-type{font-size:11px;color:#aaa;margin-top:5px;line-height:1.4}
.prog-impact-card.l3 .prog-impact-type{color:rgba(255,255,255,0.35)}
.prog-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px;margin-bottom:8px}
.prog-team-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:22px 18px;text-align:center}
.prog-team-avatar{width:60px;height:60px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;margin:0 auto 12px}
.prog-team-name{font-weight:900;font-size:14px;color:#1a1a1a;margin-bottom:5px}
.prog-team-role{font-size:12px;color:#666;line-height:1.55}
.prog-cohort-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:8px}
.prog-cohort-card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:22px 20px;display:flex;flex-direction:column}
.prog-cohort-logo-wrap{width:56px;height:56px;border-radius:12px;border:1px solid #f0f0f0;background:#fafafa;display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;flex-shrink:0}
.prog-cohort-logo-wrap img{width:48px;height:48px;object-fit:contain}
.prog-cohort-logo-initial{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;letter-spacing:-1px}
.prog-cohort-name{font-weight:900;font-size:15px;color:#1a1a1a;margin-bottom:9px}
.prog-cohort-desc{font-size:13px;color:#666;line-height:1.7;margin-bottom:14px;flex:1}
.prog-cohort-quote{font-style:italic;font-size:13px;color:#1a1a1a;font-weight:700;border-left:3px solid #1a1a1a;padding-left:12px;margin:0}
.prog-partner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.prog-partner-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:20px}
.prog-partner-name{font-weight:900;font-size:15px;color:#1a1a1a;margin-bottom:7px}
.prog-partner-desc{font-size:12px;color:#666;line-height:1.65}
@media(max-width:600px){
  .prog-result-grid{grid-template-columns:1fr}
  .prog-hero-title{font-size:32px}
  .prog-impact{grid-template-columns:1fr}
  .prog-phase-grid{grid-template-columns:1fr}
  .aipa-step-num{font-size:70px;top:16px;right:16px}
  .aipa-step-title{font-size:22px}
  .prog-menu{grid-template-columns:repeat(2,1fr)}
}

/* PROGRAM MENU */
.prog-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.prog-menu-card{border-radius:18px;padding:24px 20px;position:relative;overflow:hidden;border:1.5px solid transparent;cursor:default}
.prog-menu-card-01{background:#eef3ff;border-color:#c8d8ff}
.prog-menu-card-02{background:#ecfaf5;border-color:#b6ecd5}
.prog-menu-card-03{background:#fff8ec;border-color:#fdddb0}
.prog-menu-card-04{background:#f3effd;border-color:#d5c6f8}
.prog-menu-accent{width:32px;height:4px;border-radius:3px;margin-bottom:14px}
.prog-menu-card-01 .prog-menu-accent{background:#4a72d4}
.prog-menu-card-02 .prog-menu-accent{background:#27a76a}
.prog-menu-card-03 .prog-menu-accent{background:#e08a2a}
.prog-menu-card-04 .prog-menu-accent{background:#7c4dca}
.prog-menu-num{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#8aa0c8;margin-bottom:6px}
.prog-menu-card-02 .prog-menu-num{color:#5cb88c}
.prog-menu-card-03 .prog-menu-num{color:#c48836}
.prog-menu-card-04 .prog-menu-num{color:#9b72d8}
.prog-menu-code{font-size:24px;font-weight:900;letter-spacing:-0.5px;color:#0d2255;margin-bottom:4px;line-height:1}
.prog-menu-name{font-size:12px;font-weight:700;color:#2a3f6a;margin-bottom:10px;line-height:1.4}
.prog-menu-for{font-size:11px;color:#6b7fa0;font-weight:600;line-height:1.45}
.prog-menu-card-02 .prog-menu-for{color:#3d8c63}
.prog-menu-card-03 .prog-menu-for{color:#a0682a}
.prog-menu-card-04 .prog-menu-for{color:#6840a8}

/* EVENTS */
.event-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;overflow:hidden;margin-bottom:12px;transition:box-shadow .2s}
.event-card:hover{box-shadow:0 2px 14px rgba(0,0,0,0.06)}
.event-header{background:#f5f5f5;padding:12px 18px;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center;gap:10px}
.event-avatar{width:36px;height:36px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0}
.event-name{font-weight:800;font-size:13px;color:#1a1a1a}
.event-date{font-size:10px;color:#666}
.event-type{background:#fff;border:1px solid #e8e8e8;border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;color:#666;white-space:nowrap}
.event-body{padding:14px 18px}
.event-title{font-weight:900;font-size:14px;color:#1a1a1a;margin-bottom:4px}
.event-meta{font-size:11px;color:#666;font-weight:700;margin-bottom:9px}
.event-desc{font-size:13px;color:#666;line-height:1.75;margin:0 0 10px}
.event-footer{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid #e8e8e8}
.event-actions span{font-size:11px;color:#666;font-weight:600;cursor:pointer;margin-right:14px}
.event-btn{font-size:11px;background:#1a1a1a;color:#fff;border-radius:7px;padding:6px 13px;font-weight:700;font-family:'Nunito',sans-serif}

/* RESEARCH */
.research-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:20px 22px;margin-bottom:14px;position:relative;transition:box-shadow .2s}
.research-card:hover{box-shadow:0 2px 16px rgba(0,0,0,0.07)}
.research-featured{position:absolute;top:16px;right:16px;background:#1a1a1a;color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:3px 8px;letter-spacing:0.5px;text-transform:uppercase}
.research-title{font-weight:900;font-size:16px;color:#1a1a1a;margin-bottom:6px;line-height:1.3}
.research-venue{font-size:12px;color:#666;font-weight:700;margin-bottom:6px;font-style:italic}
.research-loc{font-size:12px;color:#666;margin-bottom:4px;font-weight:500}
.research-abs{font-size:13px;color:#666;line-height:1.75;margin:12px 0 14px;padding-top:12px;border-top:1px solid #e8e8e8}
.ieee-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#f5f5f5;border:1px solid #e8e8e8;color:#1a1a1a;border-radius:8px;padding:6px 13px;font-weight:700;font-family:'Nunito',sans-serif}

/* WRITING GRID */
.writing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.writing-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s}
.writing-card:hover{box-shadow:0 2px 16px rgba(0,0,0,0.07)}
.writing-title{font-weight:900;font-size:14px;color:#1a1a1a;line-height:1.3}
.writing-venue{font-size:12px;color:#666;font-weight:700;font-style:italic}
.writing-abs{font-size:12px;color:#666;line-height:1.7;margin:0}
.writing-link{font-size:11px;color:#666;font-weight:700;text-decoration:underline;margin-top:auto}

/* RECOGNITION */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.feat-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:18px}
.feat-type{font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}

// ── ROUTER ───────────────────────────────────────────────
const PAGES = {
  about: pageAbout,
  experience: pageExperience,
  products: pageProducts,
  aipa: pageAIPA,
  events: pageEvents,
  research: pageResearch,
  recognition: pageRecognition,
  contact: pageContact
};

let currentPage = 'about';

function showPage(id, updateHistory = true){
  currentPage = id;
  // render page
  document.getElementById('app').innerHTML = `<div class="page active" id="pg-${id}">${PAGES[id]()}</div>`;
  // update nav
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === id);
  });
  window.scrollTo(0,0);
  // update URL
  if(updateHistory){
    const path = id === 'about' ? '/' : `/${id}`;
    window.history.pushState({ page: id }, '', path);
  }
}

function getPageFromURL(){
  const path = window.location.pathname;
  if(path === '/' || path === '') return 'about';
  return path.replace(/\//g, '').toLowerCase();
}

window.addEventListener('popstate', (e)=>{
  const page = e.state?.page || getPageFromURL();
  if(PAGES[page]) showPage(page, false);
});

function toggleExp(i){
  const body = document.getElementById('expb'+i);
  const arr  = document.getElementById('arr'+i);
  body.classList.toggle('open');
  arr.classList.toggle('open');
}

// ── INIT ─────────────────────────────────────────────────
(function init(){
  // build nav
  const tabs = document.getElementById('navTabs');
  NAV.forEach(n=>{
    const id = n.id;
    const text = n.text;
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.dataset.page = id;
    btn.textContent = text;
    btn.onclick = ()=>showPage(id);
    tabs.appendChild(btn);
  });
  // load page from URL
  const pageFromURL = getPageFromURL();
  const initialPage = PAGES[pageFromURL] ? pageFromURL : 'about';
  showPage(initialPage, false);
})();
</script>
