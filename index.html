<style>
/* ── DESIGN TOKENS (Neo-brutalist "classroom guide" — cream + Nunito) ── */
:root{
  --bg:#f0e9d8;
  --bg-soft:#f5efe1;
  --paper:#fffdf6;
  --paper-2:#faf3e1;
  --paper-3:#f6efdd;
  --ink:#1a1a1a;
  --ink-2:#2f2b24;
  --muted:#6b6356;
  --muted-2:#8a8375;
  --line:#1a1a1a;
  --line-soft:#ddd2b8;
  --shadow-line:#d4d4d4;
  --accent:#d9663f;
  --accent-hover:#c4542f;
  --accent-blue:#3a6b8c;
  --accent-purple:#8b5a9c;
  --hl:#fff23d;
  --accent-sage:#cfe3c4;
  --accent-sage-ink:#1d6f42;
  --accent-peach:#f6cdaa;
  --accent-peach-ink:#9c4516;
  --accent-lilac:#dccdec;
  --accent-lilac-ink:#5e3bb7;
  --accent-rose:#f6c8c2;
  --accent-rose-ink:#b1362a;
  --accent-maroon-light:#e3c4be;
  --accent-maroon-ink:#8b4842;
  --accent-butter:#f8e7a8;
  --accent-butter-ink:#8a6a00;
  --accent-sky:#bcd3df;
  --accent-sky-ink:#2c5670;
  --serif:"Nunito",system-ui,sans-serif;
  --sans:"Nunito",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Nunito",system-ui,sans-serif;
  --radius-sm:10px;
  --radius:14px;
  --radius-lg:20px;
  --radius-xl:26px;
  --border:2.5px solid var(--line);
  --nb-shadow:3px 3px 0 var(--shadow-line);
  --nb-shadow-sm:2px 2px 0 var(--shadow-line);
  --shadow-sm:2px 2px 0 var(--shadow-line);
  --shadow:3px 3px 0 var(--shadow-line);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  font-size:17px;
  line-height:1.47;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  letter-spacing:-0.003em;
}
a{text-decoration:none;color:var(--accent)}
a:hover{text-decoration:underline}
.contact-card:hover,.product-preview:hover,.product-card:hover a,
.link-btn:hover,.btn-dark:hover,.event-btn:hover,
.aipa-btn-white:hover,.aipa-btn-ghost:hover,.li-post-cta:hover,
.exp-link:hover,.dig8-feed-btn:hover,.ieee-btn:hover,.writing-link:hover{text-decoration:none}
button{font-family:var(--sans);cursor:pointer}
em,i{font-style:italic;font-weight:inherit}
.aipa-slide[data-program]:not([data-program="all"]) {
  display: none;
}
.aipa-slide[data-program="all"] {
  display: block;
}
.aipa-slide[data-aicw]:not([data-aicw="all"]) {
  display: none;
}
.aipa-slide[data-aicw="all"] {
  display: block;
}

/* NAV — Apple's signature translucent thin bar */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,0.72);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,0.06);
  padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  height:48px;gap:10px;
}
.nav-brand{
  font-weight:600;font-size:17px;letter-spacing:-0.012em;
  background:none;border:none;color:var(--ink);padding:0;
}
.nav-brand::after{content:''}
.nav-tabs{display:flex;flex-wrap:wrap;gap:0}
.nav-btn{
  background:transparent;color:var(--ink);
  border:none;border-radius:0;
  padding:6px 12px;font-size:12px;font-weight:400;
  transition:opacity .2s ease;
  font-family:var(--sans);letter-spacing:-0.005em;opacity:0.88;
}
.nav-btn:hover{opacity:0.6}
.nav-btn.active{font-weight:500;opacity:1}

/* NAV DROPDOWN */
.nav-dropdown{position:relative;display:inline-block}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown-menu:hover{display:block}
.nav-dropdown-menu{display:none;position:absolute;top:100%;left:0;background:var(--paper);border:1px solid rgba(0,0,0,0.08);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.10);min-width:180px;z-index:100;padding:6px 0}
.nav-dropdown-item{display:block;width:100%;background:transparent;border:none;text-align:left;padding:8px 16px;font-size:12px;font-weight:400;color:var(--ink);font-family:var(--sans);letter-spacing:-0.005em;cursor:pointer;white-space:nowrap}
.nav-dropdown-item:hover{background:var(--paper-2);color:var(--accent)}
.nav-dropdown-arrow{font-size:9px;margin-left:3px;opacity:0.5}

/* PAGE */
.page{width:80%;max-width:1600px;margin:0 auto;padding:88px 22px 80px;display:none}
.page.active{display:block;animation:fadeUp .5s ease both}
/* Width responsiveness — widen as the viewport shrinks so content stays comfortable on every device */
@media(max-width:1024px){.page{width:88%}}
@media(max-width:768px){.page{width:92%}}
@media(max-width:600px){.page{width:94%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* SECTION TITLE — Apple's huge bold sans-serif headlines */
.section-title{
  font-family:var(--sans);
  font-size:64px;font-weight:600;
  margin:0 0 12px;letter-spacing:-0.025em;
  color:var(--ink);line-height:1.05;
}
.section-sub{
  font-size:21px;color:var(--muted);
  margin:0 0 56px;font-weight:400;line-height:1.4;
  letter-spacing:-0.005em;
  max-width:62ch;
}
.sub-label{display:flex;align-items:center;gap:14px;margin:64px 0 24px}
.sub-label h3{
  font-family:var(--sans);
  font-size:32px;font-weight:600;margin:0;color:var(--ink);
  white-space:nowrap;letter-spacing:-0.018em;
}
.sub-label-line{flex:1;height:1px;background:var(--line-soft)}
.lbl{
  font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px;
}

/* CARDS */
.card{
  background:var(--paper);
  border:1px solid var(--line-soft);
  border-radius:var(--radius-lg);
  padding:24px 28px;
  transition:transform .25s ease, box-shadow .25s ease;
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat-box{
  background:var(--paper-2);
  border:none;
  border-radius:var(--radius-lg);
  padding:28px 14px;text-align:center;
  transition:transform .25s ease;
}
.stat-box:hover{transform:translateY(-2px)}
.stat-val{
  font-family:var(--sans);
  font-size:48px;font-weight:600;letter-spacing:-0.025em;color:var(--ink);line-height:1;
}
.stat-lbl{font-size:13px;color:var(--muted);margin-top:10px;font-weight:500;letter-spacing:-0.005em}

/* CHIP */
.chip{
  background:var(--paper-2);
  border:none;
  border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-2);
  display:inline-block;letter-spacing:-0.005em;
}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}

/* EXP CARD — clean list style */
.exp-list{display:flex;flex-direction:column;gap:0}
.exp-card{
  display:flex;gap:16px;align-items:flex-start;
  padding:20px 0;
  border-bottom:1px solid var(--line-soft);
}
.exp-card:last-child{border-bottom:none}
.exp-logo{
  width:44px;height:44px;min-width:44px;
  border-radius:10px;border:1px solid var(--line-soft);
  background:var(--paper-2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;overflow:hidden;
}
.exp-logo img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.exp-content{flex:1;min-width:0}
.exp-org{
  font-family:var(--sans);
  font-weight:700;font-size:15px;color:var(--ink);
  margin-bottom:2px;letter-spacing:-0.01em;
}
.exp-role{
  font-size:13px;color:var(--muted);font-weight:400;
  margin-bottom:6px;line-height:1.4;
}
.exp-desc{font-size:13px;color:var(--muted);line-height:1.6}
.exp-period{font-size:12px;color:var(--muted-2);white-space:nowrap;padding-top:2px;font-weight:500}
/* legacy — keep so toggleExp JS doesn't crash */
.exp-header,.exp-arrow,.exp-body,.exp-link{display:none!important}
.exp-dd-toggle{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-weight:600;font-size:13px;
  color:var(--accent-sage-ink);
  background:var(--accent-sage);
  border:1px solid var(--accent-sage-ink);
  border-radius:9px;padding:7px 14px;cursor:pointer;
  transition:background .18s ease,transform .18s ease;
}
.exp-dd-toggle:hover{background:#c2dab4;transform:translateY(-1px)}
.exp-dd-caret{display:inline-block;transition:transform .25s ease;font-size:11px}
.exp-dd-toggle[aria-expanded="true"] .exp-dd-caret{transform:rotate(180deg)}
.exp-dd-panel{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;margin-top:0;
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .35s ease,opacity .3s ease,margin-top .35s ease;
}
.exp-dd-panel.open{max-height:1200px;opacity:1;margin-top:14px}
.exp-dd-box{
  display:flex;gap:11px;align-items:flex-start;
  background:var(--paper-2);
  border:1px solid var(--line-soft);
  border-radius:12px;padding:14px;
}
.exp-dd-icon{
  width:34px;height:34px;min-width:34px;border-radius:9px;
  background:var(--paper);border:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.exp-dd-title{font-family:var(--sans);font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:5px;line-height:1.3}
.exp-dd-desc{font-size:12.5px;color:var(--muted);line-height:1.6}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.product-card{
  background:var(--paper-2);
  border:none;
  border-radius:var(--radius-xl);
  overflow:hidden;display:flex;flex-direction:column;
  transition:box-shadow .3s ease, transform .3s ease;
}
.product-card:hover{box-shadow:0 12px 32px rgba(0,0,0,0.08);transform:translateY(-3px)}
.product-preview{display:block;overflow:hidden;position:relative;background:var(--bg)}
.product-preview img{width:100%;height:220px;object-fit:cover;object-position:top;display:block;transition:transform .6s ease}
.product-preview:hover img{transform:scale(1.04)}
.preview-badge{
  position:absolute;top:14px;right:14px;
  background:rgba(0,0,0,0.55);color:#fff;
  font-size:11px;font-weight:500;border-radius:999px;padding:6px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:-0.005em;
}
.product-body{padding:28px;display:flex;flex-direction:column;gap:14px;flex:1}
.product-emoji{font-size:32px;margin-bottom:4px}
.product-name{
  font-family:var(--sans);
  font-weight:600;font-size:28px;color:var(--ink);letter-spacing:-0.018em;line-height:1.1;
}
.product-tag{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:-0.005em}
.product-desc{font-size:15px;color:var(--ink-2);line-height:1.6;margin:0}
.product-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.pstat{
  background:var(--paper);
  border:none;
  border-radius:var(--radius);
  padding:14px 8px;text-align:center;
}
.pstat-val{font-family:var(--sans);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-0.018em;line-height:1}
.pstat-lbl{font-size:11px;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:-0.005em}

/* PROGRAM BANNER — Apple dark hero */
.prog-banner{
  background:#000;
  border-radius:var(--radius-xl);
  padding:48px 44px;margin-bottom:30px;color:#f5f5f7;
  position:relative;overflow:hidden;
}
.prog-banner::before{display:none}
.prog-banner-tag{
  display:inline-block;background:transparent;
  border:none;
  border-radius:0;padding:0;font-size:14px;font-weight:500;
  letter-spacing:-0.005em;text-transform:none;margin-bottom:14px;
  color:var(--accent);
}
.prog-banner h3{
  font-family:var(--sans);font-size:48px;font-weight:600;
  margin:0 0 16px;letter-spacing:-0.022em;line-height:1.05;
  color:#f5f5f7;
}
.prog-banner p{font-size:18px;color:rgba(245,245,247,0.8);margin:0 0 28px;line-height:1.5;max-width:60ch;letter-spacing:-0.005em}
.prog-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.prog-stat{
  background:rgba(255,255,255,0.06);
  border:none;
  border-radius:var(--radius-lg);
  padding:22px 14px;text-align:center;
}
.prog-stat-val{font-family:var(--sans);font-size:34px;font-weight:600;color:#f5f5f7;letter-spacing:-0.022em;line-height:1}
.prog-stat-lbl{font-size:12px;font-weight:500;color:rgba(245,245,247,0.7);margin-top:8px;letter-spacing:-0.005em}
.prog-stat-sub{font-size:11px;color:rgba(245,245,247,0.5);margin-top:4px;line-height:1.4}

/* FORMAT CARDS */
.format-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.format-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px 22px}
.format-num{
  background:var(--accent);color:#fff;
  border-radius:50%;width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;margin-left:6px;
}
.format-title{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:4px;letter-spacing:-0.012em}
.format-sub{font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:500;letter-spacing:-0.005em}
.format-desc{font-size:14px;color:var(--ink-2);line-height:1.55;margin:0 0 10px}

/* CURRICULUM */
.curr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.curr-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:22px}
.curr-phase{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:8px;letter-spacing:-0.005em;text-transform:none}
.curr-title{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:14px;letter-spacing:-0.012em}
.curr-week{font-size:13px;color:var(--ink-2);line-height:1.55;margin-bottom:6px;padding-left:12px;border-left:2px solid var(--line-soft)}

/* DIFF GRID */
.diff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.diff-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:20px;display:flex;gap:14px}
.diff-num{
  background:var(--accent);color:#fff;
  border-radius:50%;width:26px;height:26px;min-width:26px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
}
.diff-t{font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);margin-bottom:4px;letter-spacing:-0.012em}
.diff-d{font-size:13px;color:var(--muted);line-height:1.55}

/* PROGRAM PAGE — Apple dark hero */
.prog-hero{
  background:#000;
  border-radius:var(--radius-xl);
  padding:72px 56px;margin-bottom:36px;color:#f5f5f7;
  position:relative;overflow:hidden;
}
.prog-hero::before{display:none}
.prog-hero-tag{
  font-size:14px;font-weight:500;letter-spacing:-0.005em;text-transform:none;
  color:var(--accent);margin-bottom:18px;
}
.prog-hero-title{
  font-family:var(--sans);font-size:80px;font-weight:600;
  line-height:1;letter-spacing:-0.025em;margin-bottom:24px;color:#f5f5f7;
}
.prog-hero-sub{font-size:21px;color:rgba(245,245,247,0.8);line-height:1.5;margin:0;max-width:62ch;letter-spacing:-0.005em}
.prog-result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
.prog-result-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:36px;text-align:center}
.prog-result-val{font-family:var(--sans);font-size:88px;font-weight:600;letter-spacing:-0.028em;color:var(--ink);line-height:1}
.prog-result-label{font-size:14px;color:var(--ink-2);font-weight:500;margin-top:14px;letter-spacing:-0.005em}
.prog-result-sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.aipa-step{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:40px;margin-bottom:22px;overflow:hidden;position:relative}
.aipa-step-num{
  font-family:var(--sans);
  font-size:160px;font-weight:700;color:rgba(0,0,0,0.04);
  line-height:0.8;letter-spacing:-0.04em;
  position:absolute;right:30px;top:20px;user-select:none;pointer-events:none;
}
.aipa-step-tag{font-size:13px;font-weight:500;letter-spacing:-0.005em;text-transform:none;color:var(--accent);margin-bottom:14px}
.aipa-step-title{font-family:var(--sans);font-size:44px;font-weight:600;letter-spacing:-0.022em;color:var(--ink);margin-bottom:8px;line-height:1.05}
.aipa-step-sub{font-size:18px;color:var(--muted);margin-bottom:22px;font-weight:400;font-style:italic;font-family:var(--sans);letter-spacing:-0.005em}
.aipa-step-desc{font-size:17px;color:var(--ink-2);line-height:1.5;margin-bottom:24px;max-width:64ch;letter-spacing:-0.005em}
.aipa-step-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.aipa-step-badge{background:var(--paper);border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-0.005em}
.prog-sub-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:8px}
.prog-sub-card{background:var(--paper);border:none;border-radius:var(--radius-lg);padding:22px}
.prog-sub-card-num{
  background:var(--accent);color:#fff;
  border-radius:50%;width:28px;height:28px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;margin-bottom:12px;
}
.prog-sub-title{font-family:var(--sans);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:6px;letter-spacing:-0.012em}
.prog-sub-desc{font-size:13px;color:var(--muted);line-height:1.55}
.prog-phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:4px 0 22px}
.prog-phase-card{background:var(--paper);border:none;border-radius:var(--radius-lg);padding:24px 22px}
.prog-phase-num{font-size:12px;font-weight:500;text-transform:none;letter-spacing:-0.005em;color:var(--accent);margin-bottom:10px}
.prog-phase-title{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:12px;letter-spacing:-0.012em}
.prog-phase-item{font-size:13px;color:var(--ink-2);line-height:1.55;padding-left:10px;border-left:2px solid var(--line-soft);margin-bottom:6px}
.prog-impact{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:4px 0 22px}
.prog-impact-card{border-radius:var(--radius-lg);padding:30px 22px;text-align:center}
.prog-impact-card.l1{background:var(--paper-2);border:none}
.prog-impact-card.l1 .prog-impact-val{color:var(--ink)}
.prog-impact-card.l1 .prog-impact-label{color:var(--ink-2)}
.prog-impact-card.l1 .prog-impact-type{color:var(--muted)}
.prog-impact-card.l2{background:var(--accent);border:none;color:#fff}
.prog-impact-card.l2 .prog-impact-val{color:#fff}
.prog-impact-card.l2 .prog-impact-label{color:rgba(255,255,255,0.92)}
.prog-impact-card.l2 .prog-impact-type{color:rgba(255,255,255,0.7)}
.prog-impact-card.l3{background:#000;border:none;color:#f5f5f7}
.prog-impact-card.l3 .prog-impact-val{color:#f5f5f7}
.prog-impact-card.l3 .prog-impact-label{color:rgba(245,245,247,0.85)}
.prog-impact-card.l3 .prog-impact-type{color:rgba(245,245,247,0.55)}
.prog-impact-val{font-family:var(--sans);font-size:64px;font-weight:600;letter-spacing:-0.025em;color:var(--ink);margin-bottom:4px;line-height:1}
.prog-impact-label{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:-0.005em;margin-top:8px}
.prog-impact-type{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.prog-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px;margin-bottom:8px}
.prog-team-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:28px 22px;text-align:center}
.prog-team-avatar{
  width:64px;height:64px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:22px;font-weight:600;color:#fff;
  margin:0 auto 14px;letter-spacing:-0.018em;
}
.prog-team-name{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:6px;letter-spacing:-0.012em}
.prog-team-role{font-size:12px;color:var(--muted);line-height:1.5}
.prog-cohort-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:8px}
.prog-cohort-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column}
.prog-cohort-logo-wrap{width:60px;height:60px;border-radius:14px;border:1px solid var(--line-soft);background:var(--paper);display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;flex-shrink:0}
.prog-cohort-logo-wrap img{width:48px;height:48px;object-fit:contain}
.prog-cohort-logo-initial{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;color:#fff;letter-spacing:-0.012em}
.prog-cohort-name{font-family:var(--sans);font-weight:600;font-size:22px;color:var(--ink);margin-bottom:12px;letter-spacing:-0.018em;line-height:1.15}
.prog-cohort-desc{font-size:14px;color:var(--ink-2);line-height:1.55;margin-bottom:14px;flex:1}
.prog-cohort-quote{font-family:var(--sans);font-style:italic;font-size:15px;color:var(--ink);font-weight:400;border-left:2px solid var(--accent);padding-left:14px;margin:0;line-height:1.5}
.prog-partner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:8px}
.prog-partner-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px}
.prog-partner-name{font-family:var(--sans);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:8px;letter-spacing:-0.012em}
.prog-partner-desc{font-size:13px;color:var(--muted);line-height:1.55}

@media(max-width:600px){
  .prog-result-grid{grid-template-columns:1fr}
  .prog-hero-title{font-size:44px;letter-spacing:-0.022em}
  .prog-impact{grid-template-columns:1fr}
  .prog-phase-grid{grid-template-columns:1fr}
  .aipa-step-num{font-size:90px;top:16px;right:16px}
  .aipa-step-title{font-size:30px}
  .prog-menu{grid-template-columns:repeat(2,1fr)}
  .section-title{font-size:40px}
  .section-sub{font-size:17px}
}

/* PROGRAM MENU */
.prog-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px}
.prog-menu-card{border-radius:var(--radius-lg);padding:28px 24px;position:relative;overflow:hidden;border:none;cursor:default;transition:transform .25s ease,box-shadow .25s ease;outline:2px solid transparent;outline-offset:2px}
.prog-menu-card:hover{transform:translateY(-2px)}
.prog-menu-card-active{outline-color:var(--ink);box-shadow:0 6px 22px rgba(0,0,0,0.12)}
.prog-menu-card-01{background:var(--paper-2)}
.prog-menu-card-02{background:#fff5e6}
.prog-menu-card-03{background:#ffe9e5}
.prog-menu-card-04{background:#ece5fb}
.prog-menu-accent{width:36px;height:4px;border-radius:3px;margin-bottom:18px}
.prog-menu-card-01 .prog-menu-accent{background:var(--accent)}
.prog-menu-card-02 .prog-menu-accent{background:#ff6a00}
.prog-menu-card-03 .prog-menu-accent{background:#fa233b}
.prog-menu-card-04 .prog-menu-accent{background:#a06bff}
.prog-menu-num{font-size:11px;font-weight:500;letter-spacing:-0.005em;text-transform:none;margin-bottom:8px}
.prog-menu-card-01 .prog-menu-num{color:var(--accent)}
.prog-menu-card-02 .prog-menu-num{color:#ff6a00}
.prog-menu-card-03 .prog-menu-num{color:#fa233b}
.prog-menu-card-04 .prog-menu-num{color:#a06bff}
.prog-menu-code{font-family:var(--sans);font-size:32px;font-weight:600;letter-spacing:-0.022em;color:var(--ink);margin-bottom:8px;line-height:1}
.prog-menu-name{font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:10px;line-height:1.4;letter-spacing:-0.005em}
.prog-menu-for{font-size:12px;color:var(--muted);font-weight:400;line-height:1.5}

/* USE CASE MENU */
.uc-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.uc-menu-card{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:26px 22px;transition:box-shadow .2s ease,transform .2s ease}
.uc-menu-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.uc-menu-icon{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper-2);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.uc-menu-icon svg{width:20px;height:20px;stroke:var(--ink-2);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.uc-menu-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:-0.008em;line-height:1.3}
.uc-menu-desc{font-size:12px;color:var(--muted);font-weight:400;line-height:1.5;letter-spacing:-0.003em}
@media(max-width:700px){.uc-menu{grid-template-columns:repeat(2,1fr)}}

/* PRODUCT SELECTOR */
.prod-selector{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.prod-sel-btn{
  background:var(--paper-2);border:none;border-radius:12px;
  padding:14px 22px;font-size:14px;font-weight:500;color:var(--ink-2);
  cursor:pointer;font-family:var(--sans);letter-spacing:-0.005em;
  transition:background .2s ease,color .2s ease,transform .15s ease;
  min-width:120px;text-align:center;
}
.prod-sel-btn:hover:not(.active){filter:brightness(0.92);transform:translateY(-1px)}
.prod-sel-btn[onclick*="easyflow"]{background:#dbeafe;color:#1d4ed8}
.prod-sel-btn[onclick*="easyflow"].active{background:#2563eb;color:#fff}
.prod-sel-btn[onclick*="easydo"]{background:#dcfce7;color:#166534}
.prod-sel-btn[onclick*="easydo"].active{background:#16a34a;color:#fff}
.prod-sel-btn[onclick*="commengine"]{background:#fef9c3;color:#854d0e}
.prod-sel-btn[onclick*="commengine"].active{background:#ca8a04;color:#fff}
.prod-sel-btn[onclick*="jachai"]{background:#fce7f3;color:#9d174d}
.prod-sel-btn[onclick*="jachai"].active{background:#db2777;color:#fff}
.prod-sel-btn[onclick*="swachho"]{background:#cffafe;color:#0e7490}
.prod-sel-btn[onclick*="swachho"].active{background:#0891b2;color:#fff}

/* PRODUCT EMBED PANEL */
.prod-embed-panel{display:none;border-radius:var(--radius-xl);overflow:hidden;background:var(--paper-2);margin-bottom:28px}
.prod-embed-panel.active{display:block}
.prod-embed-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 22px;background:var(--paper);
  border-bottom:1px solid var(--line-soft);flex-wrap:wrap;gap:10px;
}
.prod-embed-name{font-family:var(--sans);font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-0.012em}
.prod-embed-url{font-size:12px;color:var(--muted);letter-spacing:-0.005em}
.prod-embed-actions{display:flex;gap:8px;align-items:center}
.prod-embed-link{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:500;color:var(--accent);
  background:var(--paper-2);border:none;border-radius:999px;
  padding:7px 14px;text-decoration:none;letter-spacing:-0.005em;
  transition:background .2s;
}
.prod-embed-link:hover{background:var(--accent);color:#fff;text-decoration:none}
.prod-embed-frame{
  width:100%;height:680px;border:none;display:block;
  background:var(--paper);
}
@media(max-width:700px){.prod-embed-frame{height:460px}}

/* EVENTS */
.event-filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.event-filter-btn{border:none;border-radius:999px;padding:7px 16px;font-size:12px;font-weight:500;font-family:var(--sans);cursor:pointer;letter-spacing:-0.005em;transition:background .18s,color .18s,box-shadow .18s;background:var(--paper-2);color:var(--muted)}
.event-filter-btn:hover{background:var(--line-soft);color:var(--ink)}
.event-filter-btn.active{background:var(--ink);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.event-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;grid-auto-rows:360px}
@media(max-width:700px){.event-grid{grid-template-columns:1fr;grid-auto-rows:360px}}
.event-card{border:none;border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow .25s ease,transform .25s ease;display:flex;flex-direction:column;height:360px}
.event-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
/* per-type accent colors */
.event-card[data-type="Panel / Speaker"]{background:linear-gradient(135deg,#e8f4fd 0%,#dbeeff 100%)}
.event-card[data-type="Policy"]{background:linear-gradient(135deg,#e8f5ee 0%,#d4eddf 100%)}
.event-card[data-type="Program Launch"]{background:linear-gradient(135deg,#fef3e2 0%,#fde8c2 100%)}
.event-card[data-type="Certification"]{background:linear-gradient(135deg,#f3e8fd 0%,#e8d4f7 100%)}
.event-card[data-type="Award Ceremony"]{background:linear-gradient(135deg,#fff8e1 0%,#fdefc3 100%)}
.event-card[data-type="Social Initiative"]{background:linear-gradient(135deg,#fde8ea 0%,#fdd4d7 100%)}
.event-card[data-type="LinkedIn Post"]{background:linear-gradient(135deg,#e8f0fe 0%,#dce8fc 100%)}
.event-header{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;flex-shrink:0}
.event-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:13px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:-0.012em}
.event-name{font-weight:600;font-size:13px;color:var(--ink);letter-spacing:-0.005em}
.event-date{font-size:11px;color:var(--muted);letter-spacing:-0.005em}
.event-type{border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:-0.005em;background:rgba(0,0,0,.07);color:var(--ink)}
.event-body{padding:4px 20px 18px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.event-title{font-family:var(--sans);font-weight:600;font-size:16px;color:var(--ink);margin-bottom:6px;letter-spacing:-0.014em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.event-meta{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:8px;letter-spacing:-0.005em;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event-desc{font-size:13px;color:var(--ink-2);line-height:1.5;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.event-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);margin-top:auto}
.event-actions span{font-size:12px;color:var(--muted);font-weight:400;cursor:pointer;margin-right:12px;letter-spacing:-0.005em}
.event-btn{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 15px;font-weight:500;font-family:var(--sans);letter-spacing:-0.005em;text-transform:none}
.event-btn:hover{opacity:.82;text-decoration:none}
.event-card[data-type="Panel / Speaker"] .event-btn{background:#1a73e8}
.event-card[data-type="Policy"] .event-btn{background:#1a8f4e}
.event-card[data-type="Program Launch"] .event-btn{background:#e07c00}
.event-card[data-type="Certification"] .event-btn{background:#8a2be2}
.event-card[data-type="Award Ceremony"] .event-btn{background:#b8860b}
.event-card[data-type="Social Initiative"] .event-btn{background:#c0392b}
.event-card[data-type="LinkedIn Post"] .event-btn{background:#0a66c2}

/* NEWS CARDS */
.news-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;grid-auto-rows:320px}
@media(max-width:700px){.news-grid{grid-template-columns:1fr;grid-auto-rows:auto}}
.news-card{border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;height:320px;transition:box-shadow .25s ease,transform .25s ease;border:1.5px solid var(--line-soft)}
.news-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.news-card:nth-child(4n+1){background:linear-gradient(135deg,#e8f4fd 0%,#dbeeff 100%)}
.news-card:nth-child(4n+2){background:linear-gradient(135deg,#e8f5ee 0%,#d4eddf 100%)}
.news-card:nth-child(4n+3){background:linear-gradient(135deg,#fef3e2 0%,#fde8c2 100%)}
.news-card:nth-child(4n+4){background:linear-gradient(135deg,#f3e8fd 0%,#e8d4f7 100%)}
.news-card-thumb{flex-shrink:0;height:130px;overflow:hidden;position:relative}
.news-card-thumb img{width:100%;height:100%;object-fit:cover}
.news-card-body{padding:16px 18px 14px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.news-card-headline{font-size:15px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0}
.news-card-desc{font-size:12px;color:var(--ink-2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0;margin-bottom:8px}
.news-card-footer{margin-top:auto;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.07)}
.news-pub-row{display:flex;align-items:center;gap:7px}
.news-pub-logo{width:20px;height:20px;border-radius:4px;object-fit:contain;flex-shrink:0}
.news-pub-name{font-size:11px;font-weight:700;letter-spacing:-0.005em}
.news-card-btn{font-size:11px;font-weight:600;color:#fff;border-radius:999px;padding:5px 13px;white-space:nowrap;text-decoration:none}
.news-card-btn:hover{opacity:.82;text-decoration:none}
/* DIG8 FRAMEWORK EMBED */
.dig8-embed{background:var(--paper-2);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px;border:1.5px solid var(--line-soft)}
.dig8-embed-header{background:#0a66c2;padding:18px 24px 14px;display:flex;align-items:center;gap:14px}
.dig8-embed-logo{width:42px;height:42px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dig8-embed-logo svg{width:26px;height:26px}
.dig8-embed-header-text{flex:1}
.dig8-embed-hashtag{font-family:var(--sans);font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.02em;line-height:1.1}
.dig8-embed-sub{font-size:12px;color:rgba(255,255,255,0.8);font-weight:400;margin-top:2px;letter-spacing:-0.005em}
.dig8-embed-follow-btn{background:#fff;color:#0a66c2;border-radius:999px;padding:7px 18px;font-size:13px;font-weight:600;font-family:var(--sans);letter-spacing:-0.005em;white-space:nowrap;text-decoration:none;transition:opacity .2s}
.dig8-embed-follow-btn:hover{opacity:0.88;text-decoration:none}
.dig8-embed-body{padding:20px 24px}
.dig8-embed-desc{font-size:15px;color:var(--ink-2);line-height:1.6;margin:0 0 16px;letter-spacing:-0.005em}
.dig8-embed-preview{border-radius:10px;overflow:hidden;border:1px solid var(--line-soft);margin-bottom:16px;cursor:pointer;transition:box-shadow .2s}
.dig8-embed-preview:hover{box-shadow:var(--shadow)}
.dig8-embed-preview img{width:100%;height:200px;object-fit:cover;display:block}
.dig8-embed-preview-bar{background:var(--paper);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.dig8-embed-preview-label{font-size:12px;color:var(--muted);letter-spacing:-0.005em}
.dig8-embed-preview-link{font-size:12px;font-weight:600;color:#0a66c2;letter-spacing:-0.005em}
.dig8-embed-stats{display:flex;gap:20px;padding-top:14px;border-top:1px solid var(--line-soft)}
.dig8-stat{text-align:center}
.dig8-stat-num{font-size:18px;font-weight:700;color:var(--ink);font-family:var(--sans);letter-spacing:-0.02em}
.dig8-stat-label{font-size:11px;color:var(--muted);margin-top:1px;letter-spacing:-0.005em}

/* RESEARCH */
.research-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:28px;margin-bottom:14px;position:relative;transition:box-shadow .25s ease, transform .25s ease}
.research-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.research-featured{position:absolute;top:20px;right:20px;background:var(--accent);color:#fff;font-size:11px;font-weight:500;border-radius:999px;padding:5px 12px;letter-spacing:-0.005em;text-transform:none}
.research-title{font-family:var(--sans);font-weight:600;font-size:26px;color:var(--ink);margin-bottom:8px;line-height:1.2;letter-spacing:-0.018em}
.research-venue{font-family:var(--sans);font-size:15px;color:var(--muted);font-weight:400;margin-bottom:7px;font-style:italic}
.research-loc{font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:400}
.research-abs{font-size:15px;color:var(--ink-2);line-height:1.55;margin:16px 0 16px;padding-top:16px;border-top:1px solid var(--line-soft)}
.ieee-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--paper);border:none;color:var(--accent);border-radius:999px;padding:8px 16px;font-weight:500;font-family:var(--sans);text-transform:none;letter-spacing:-0.005em}
.ieee-btn:hover{text-decoration:none;background:var(--accent);color:#fff}

/* CONSULTING */
.cons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.cons-card{margin-bottom:0;display:flex;flex-direction:column}
.cons-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:4px}
.cons-icon{flex:0 0 auto;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
.cons-title{font-size:23px;margin:6px 0 4px}
.cons-client{font-size:13px;font-weight:600;color:var(--ink);margin-top:12px;letter-spacing:-0.005em}
.cons-abs{margin:14px 0 0}
.cons-focus{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.cons-focus-item{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--ink-2);line-height:1.45}
.cons-focus-dot{color:var(--accent-sage-ink);font-weight:700;flex:0 0 auto}
.cons-clients{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.cons-cl-row{display:flex;align-items:center;gap:10px;background:var(--paper);border:none;border-radius:12px;padding:12px 14px;text-align:left;width:100%;font-family:var(--sans)}
.cons-cl-name{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-0.005em;flex:1;line-height:1.35}
.cons-cl-sector{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.cons-cl-link{cursor:pointer;transition:box-shadow .2s ease, transform .2s ease}
.cons-cl-link:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cons-cl-arrow{color:var(--accent);font-weight:700;flex:0 0 auto}

/* WRITING GRID */
.writing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.writing-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .25s ease, transform .25s ease}
.writing-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.writing-title{font-family:var(--sans);font-weight:600;font-size:21px;color:var(--ink);line-height:1.2;letter-spacing:-0.018em}
.writing-venue{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;font-style:italic}
.writing-abs{font-size:14px;color:var(--ink-2);line-height:1.55;margin:0}
.writing-link{font-size:13px;color:var(--accent);font-weight:500;text-decoration:none;margin-top:auto;letter-spacing:-0.005em;text-transform:none}
.writing-link:hover{text-decoration:underline}

/* RECOGNITION */
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.feat-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:26px;transition:box-shadow .25s ease,transform .25s ease}
.feat-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.feat-type{font-size:11px;font-weight:500;color:var(--accent);text-transform:none;letter-spacing:-0.005em;margin-bottom:10px}
.feat-title{font-family:var(--sans);font-weight:600;font-size:21px;color:var(--ink);margin-bottom:8px;letter-spacing:-0.018em;line-height:1.2}
.feat-detail{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0 0 12px}
.feat-year{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:-0.005em}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:24px}
.cert-card{display:flex;gap:18px;align-items:flex-start;border:none;border-radius:var(--radius-lg);padding:24px;transition:box-shadow .25s ease,transform .25s ease}
.cert-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.cert-badge{flex-shrink:0;min-width:60px;height:60px;padding:0 12px;border-radius:14px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:-0.01em;text-align:center}
.cert-body{flex:1;min-width:0}
.cert-title{font-family:var(--sans);font-weight:600;font-size:18px;color:var(--ink);margin-bottom:4px;letter-spacing:-0.018em;line-height:1.25}
.cert-issuer{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px;letter-spacing:-0.005em}
.cert-detail{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:0 0 8px}
.award-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:14px}
.award-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:18px 20px;display:flex;gap:14px;align-items:center;transition:box-shadow .25s ease, transform .25s ease}
.award-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.award-icon{font-size:24px}
.award-title{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px;letter-spacing:-0.012em}
.award-detail{font-size:12px;color:var(--muted)}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:12px}
.contact-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px;display:flex;gap:16px;align-items:center;text-decoration:none;transition:box-shadow .25s ease, transform .25s ease;color:var(--ink)}
.contact-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);text-decoration:none}
.contact-icon{font-size:26px}
.contact-lbl{font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:-0.005em;margin-bottom:5px}
.contact-val{font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);letter-spacing:-0.012em}
.link-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--ink);font-weight:400;background:var(--paper);transition:all .2s ease;margin:4px;letter-spacing:-0.005em}
.role-pill{display:inline-flex;align-items:center;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;color:#fff;background:var(--ink);letter-spacing:-0.005em;white-space:nowrap}
.link-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);text-decoration:none}

/* TIMELINE */
.timeline{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;padding:6px 0 8px;align-items:stretch}
.timeline-line{display:none}
.tl-item{display:flex;flex-direction:column;align-items:flex-start;min-width:140px;max-width:170px;min-height:124px;background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:16px 16px;gap:4px;flex-shrink:0;position:relative}
.tl-item.active-phase{background:#000;border-color:#000}
.tl-item.tl-new{background:var(--accent) !important;border:none !important}
.tl-dot{display:none}
.tl-year{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:-0.005em;text-transform:none}
.tl-item.active-phase .tl-year{color:rgba(245,245,247,0.55)}
.tl-item.tl-new .tl-year{color:rgba(255,255,255,0.85) !important}
.tl-label{font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);line-height:1.2;letter-spacing:-0.012em}
.tl-item.active-phase .tl-label{color:#f5f5f7}
.tl-item.tl-new .tl-label{color:#fff !important}
.tl-role{font-size:11px;font-weight:400;color:var(--muted);line-height:1.4;text-transform:none;letter-spacing:-0.005em;margin-top:3px}
.tl-item.active-phase .tl-role{color:rgba(245,245,247,0.6)}
.tl-item.tl-new .tl-role{color:rgba(255,255,255,0.8) !important}
.tl-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
.tl-item.active-phase .tl-note{color:rgba(245,245,247,0.55)}
.tl-item.tl-new .tl-note{color:rgba(255,255,255,0.75) !important;opacity:1}
.tl-arrow{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);flex-shrink:0;padding:0 2px;margin-top:0;font-weight:500}

/* BUILDING */
.building-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.building-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px;display:flex;gap:16px;align-items:flex-start;transition:box-shadow .25s ease, transform .25s ease}
.building-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.building-emoji{font-size:30px}
.building-title{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin-bottom:6px;letter-spacing:-0.012em}
.building-desc{font-size:13px;color:var(--muted);line-height:1.5}

/* COMPANY LOGOS */
.company-logos-row{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:14px;padding:24px 0 6px;overflow-x:auto}
.company-logo-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:80px;opacity:0.92;transition:opacity .2s}
.company-logo-item:hover{opacity:1}
.company-logo-wrap{width:72px;height:72px;border-radius:18px;border:none;background:var(--paper-2);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
.company-logo-wrap img{width:48px;height:48px;object-fit:contain}
.company-logo-initial{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#fff;letter-spacing:-0.012em}
.company-logo-name{font-size:11px;font-weight:500;color:var(--muted);text-align:center;line-height:1.3;max-width:80px;letter-spacing:-0.005em}
@media(max-width:600px){.company-logos-row{gap:8px}.company-logo-wrap{width:54px;height:54px}.company-logo-wrap img{width:36px;height:36px}.company-logo-name{font-size:10px}}

/* SKILLS */
.skill-pill{background:var(--ink);border:none;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;color:#fff;display:inline-block;margin:3px;letter-spacing:-0.005em}
.skill-tag{background:var(--paper-2);border:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink);font-weight:400;display:inline-block;margin:3px;letter-spacing:-0.005em}
.edu-badge{background:var(--accent);border:none;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:500;color:#fff;display:inline-block;margin-right:6px;margin-top:8px;letter-spacing:-0.005em;text-transform:none}

/* INFO NOTICE */
.notice{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:24px 28px;display:flex;gap:14px;margin-top:36px}
.notice-text{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 12px}

/* TRUSTED */
.trusted-pill{background:var(--paper-2);border:none;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500;color:var(--ink);display:inline-block;margin:3px;letter-spacing:-0.005em}

/* BTN */
.btn-dark{font-size:14px;background:var(--accent);color:#fff;border-radius:999px;padding:12px 22px;font-weight:400;font-family:var(--sans);border:none;display:inline-block;letter-spacing:-0.005em;transition:background .2s ease}
.btn-dark:hover{background:var(--accent-hover);text-decoration:none}
.btn-light{font-size:14px;background:var(--paper-2);border:none;color:var(--ink);border-radius:999px;padding:12px 22px;font-weight:400;font-family:var(--sans);display:inline-block;letter-spacing:-0.005em}

/* LI INFO BANNER */
.li-banner{display:flex;align-items:center;gap:10px;background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:14px 20px;margin-bottom:24px;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:-0.005em}

/* DIG8 LINKEDIN POSTS */
.dig8-feed-banner{background:var(--paper-2);border:none;border-radius:var(--radius-lg);padding:14px 20px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dig8-feed-left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent);font-weight:500;letter-spacing:-0.005em;text-transform:none}
.dig8-feed-btn{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-weight:400;white-space:nowrap;display:inline-block;letter-spacing:-0.005em;text-transform:none}
.li-post-card{background:var(--paper-2);border:none;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:14px;transition:box-shadow .25s ease, transform .25s ease}
.li-post-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.li-post-head{padding:20px 24px 12px;display:flex;align-items:flex-start;gap:14px}
.li-post-avatar{
  width:48px;height:48px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:16px;font-weight:600;color:#fff;
  flex-shrink:0;border:none;letter-spacing:-0.012em;
}
.li-post-meta{flex:1}
.li-post-name{font-family:var(--sans);font-weight:600;font-size:17px;color:var(--ink);margin-bottom:3px;letter-spacing:-0.012em}
.li-post-role{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:3px}
.li-post-date{font-size:11px;color:var(--muted-2);display:flex;align-items:center;gap:4px;text-transform:none;letter-spacing:-0.005em}
.li-post-badge{background:var(--paper);border:none;color:var(--accent);font-size:11px;font-weight:500;border-radius:999px;padding:5px 12px;white-space:nowrap;flex-shrink:0;letter-spacing:-0.005em;text-transform:none}
.li-post-body{padding:0 24px 14px}
.li-post-content{font-size:14px;color:var(--ink);line-height:1.6;margin:0 0 12px;white-space:pre-wrap}
.li-post-hashtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.li-post-hashtag{color:var(--accent);font-size:12px;font-weight:500;background:var(--paper);border-radius:999px;padding:4px 12px;letter-spacing:-0.005em}
.li-post-sep{height:1px;background:var(--line-soft);margin:0 24px}
.li-post-foot{padding:14px 24px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.li-post-actions{display:flex;gap:18px}
.li-post-action{font-size:12px;color:var(--muted);font-weight:400;cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none;letter-spacing:-0.005em}
.li-post-action:hover{color:var(--accent)}
.li-post-cta{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:8px 14px;font-weight:400;display:inline-block;white-space:nowrap;letter-spacing:-0.005em;text-transform:none}
.li-post-cta:hover{background:var(--accent-hover);text-decoration:none}

/* FOOTER */
footer{text-align:center;padding:36px 0 32px;color:var(--muted);font-size:13px;border-top:1px solid var(--line-soft);font-weight:400;background:transparent;letter-spacing:-0.005em}

/* ── AI-PA PRESENTATION SLIDES — Apple-style big sections ── */
.aipa-slide{border-radius:var(--radius-xl);padding:64px 56px;margin-bottom:18px;position:relative;overflow:hidden}
.aipa-dark{background:linear-gradient(135deg, #d4e8d0 0%, #e3d0cc 100%);color:#2d2d2d}
.aipa-ink{background:linear-gradient(135deg,#0f1117 0%,#1a1f2e 100%);color:#f5f5f7}
.aipa-ink .aipa-tag,.aipa-ink .aipa-step-tag{color:#6ee7b7!important}
.aipa-light{background:var(--paper-2);border:none}
.aipa-accent{background:var(--bg-soft);border:none}
.aipa-tag{font-size:18px;font-weight:500;letter-spacing:-0.005em;text-transform:none;opacity:1;color:var(--accent);margin-bottom:16px;display:block}
.aipa-headline-xl{font-family:var(--sans);font-size:68px;font-weight:600;line-height:1;letter-spacing:-0.025em;margin-bottom:24px}
.aipa-headline-lg{font-family:var(--sans);font-size:56px;font-weight:600;line-height:1.05;letter-spacing:-0.022em;margin-bottom:20px}
.aipa-body{font-size:19px;line-height:1.5;letter-spacing:-0.005em}
.aipa-body-dark{color:#3d3d3d}
.aipa-big-num{font-family:var(--sans);font-size:180px;font-weight:700;line-height:1;letter-spacing:-0.04em;opacity:0.04;position:absolute;right:30px;top:14px;pointer-events:none}
.aipa-divider{display:none}
.aipa-divider-light{display:none}
/* KPI grids */
.aipa-kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
.aipa-kpi-box{background:rgba(255,255,255,0.5);border:none;border-radius:var(--radius-lg);padding:24px}
.aipa-kpi-val{font-family:var(--sans);font-size:64px;font-weight:600;letter-spacing:-0.025em;line-height:1;margin-bottom:8px}
.aipa-kpi-lbl{font-size:13px;font-weight:500;opacity:0.8;color:#333;text-transform:none;letter-spacing:-0.005em}
/* Program cards */
.aipa-prog-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:24px}
.aipa-prog-card-dark{background:rgba(255,255,255,0.6);border:none;border-radius:var(--radius-lg);padding:24px}
.aipa-prog-card-light{background:var(--paper);border:none;border-radius:var(--radius-lg);padding:24px}
.aipa-prog-num-badge{display:inline-block;font-size:12px;font-weight:500;letter-spacing:-0.005em;text-transform:none;border-radius:999px;padding:5px 12px;margin-bottom:12px}
.aipa-prog-num-dark{background:rgba(139,72,66,0.15);color:#5a3a37}
.aipa-prog-num-light{background:var(--accent);color:#fff}
.aipa-prog-title{font-family:var(--sans);font-size:24px;font-weight:600;margin-bottom:8px;line-height:1.15;letter-spacing:-0.018em}
.aipa-prog-sub{font-size:14px;opacity:0.65;font-weight:400;margin-bottom:12px;font-style:italic;font-family:var(--sans)}
.aipa-prog-desc{font-size:14px;opacity:0.75;line-height:1.5}
/* Curriculum phases */
.aipa-phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:20px}
.aipa-phase-card{border-radius:var(--radius-lg);padding:28px 24px;position:relative;overflow:hidden}
.aipa-phase-bg{font-family:var(--sans);font-size:120px;font-weight:700;opacity:0.06;position:absolute;right:14px;top:4px;line-height:1;pointer-events:none;letter-spacing:-0.04em}
.aipa-phase-label{font-size:12px;font-weight:500;letter-spacing:-0.005em;text-transform:none;opacity:0.7;margin-bottom:10px}
.aipa-phase-title{font-family:var(--sans);font-size:22px;font-weight:600;margin-bottom:14px;line-height:1.15;letter-spacing:-0.018em}
.aipa-phase-item{font-size:14px;line-height:1.6;padding:9px 0;border-bottom:1px solid rgba(0,0,0,0.06)}
.aipa-phase-item:last-child{border-bottom:none}
/* Productivity impact */
.aipa-impact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.aipa-impact-card{border-radius:var(--radius-lg);padding:32px 18px;text-align:center}
.aipa-impact-val{font-family:var(--sans);font-size:80px;font-weight:600;letter-spacing:-0.028em;line-height:1;margin-bottom:10px}
.aipa-impact-lbl{font-size:15px;font-weight:500;margin-bottom:8px;line-height:1.3;text-transform:none;letter-spacing:-0.005em}
.aipa-impact-sub{font-size:13px;opacity:0.7;margin-bottom:12px;line-height:1.5}
.aipa-impact-badge{font-size:11px;font-weight:500;border-radius:999px;padding:5px 12px;display:inline-block;letter-spacing:-0.005em;text-transform:none}
/* Differentiators */
.aipa-diff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:20px}
.aipa-diff-item{display:flex;gap:14px;background:var(--paper);border:none;border-radius:var(--radius-lg);padding:20px}
.aipa-diff-num{
  width:28px;height:28px;min-width:28px;
  background:var(--accent);color:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;
}
.aipa-diff-title{font-family:var(--sans);font-size:17px;font-weight:600;color:var(--ink);margin-bottom:5px;letter-spacing:-0.012em}
.aipa-diff-desc{font-size:13px;color:var(--ink-2);line-height:1.55}
/* Leadership team */
.aipa-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:24px}
.aipa-team-card{background:rgba(255,255,255,0.55);border:none;border-radius:var(--radius-lg);padding:24px 20px}
.aipa-team-highlight{background:rgba(255,255,255,0.7)}
.aipa-team-avatar{
  width:52px;height:52px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:18px;font-weight:600;margin-bottom:14px;color:#fff;letter-spacing:-0.012em;
}
.aipa-team-name{font-family:var(--sans);font-size:21px;font-weight:600;margin-bottom:6px;letter-spacing:-0.018em}
.aipa-team-role{font-size:12px;opacity:0.7;font-weight:400;line-height:1.45;margin-bottom:8px;font-style:italic;font-family:var(--sans)}
.aipa-team-note{font-size:13px;opacity:0.65;line-height:1.55}
/* Cohort cards */
.aipa-cohort-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px;margin-top:20px}
.aipa-cohort-card{background:var(--paper);border:none;border-radius:var(--radius-lg);padding:28px}
.aipa-cohort-tag{font-size:12px;font-weight:500;letter-spacing:-0.005em;text-transform:none;color:var(--accent);margin-bottom:12px}
.aipa-cohort-org{font-family:var(--sans);font-size:26px;font-weight:600;color:var(--ink);margin-bottom:12px;line-height:1.15;letter-spacing:-0.018em}
.aipa-cohort-desc{font-size:14px;color:var(--ink-2);line-height:1.55;margin-bottom:14px}
.aipa-cohort-quote{font-family:var(--sans);font-size:15px;color:var(--ink);font-style:italic;font-weight:400;padding:14px 18px;background:var(--paper-2);border-radius:var(--radius);border-left:2px solid var(--accent);line-height:1.5}
/* Trusted orgs */
.aipa-trusted-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.aipa-trusted-pill{background:rgba(255,255,255,0.6);border:none;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:400;color:#333;display:inline-block;letter-spacing:-0.005em}
/* Outcome grid */
.aipa-outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.aipa-outcome-card{background:rgba(255,255,255,0.55);border:none;border-radius:var(--radius-lg);padding:24px}
.aipa-outcome-icon{font-size:30px;margin-bottom:12px}
.aipa-outcome-title{font-family:var(--sans);font-size:20px;font-weight:600;margin-bottom:6px;line-height:1.2;letter-spacing:-0.018em}
.aipa-outcome-desc{font-size:13px;opacity:0.7;line-height:1.55}
/* Technical grid */
.aipa-tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:14px;margin-top:20px}
.aipa-tech-card{background:var(--paper);border:none;border-radius:var(--radius-lg);padding:24px}
.aipa-tech-icon{font-size:30px;margin-bottom:12px}
.aipa-tech-title{font-family:var(--sans);font-size:20px;font-weight:600;color:var(--ink);margin-bottom:8px;letter-spacing:-0.018em}
.aipa-tech-desc{font-size:13px;color:var(--ink-2);line-height:1.55}
/* Suite tags */
.aipa-suite-tag{display:inline-block;background:rgba(255,255,255,0.55);border:none;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:400;color:#333;margin:3px;letter-spacing:-0.005em}
/* CTA buttons */
.aipa-cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.aipa-btn-white{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:400;font-family:var(--sans);text-decoration:none;border:none;cursor:pointer;letter-spacing:-0.005em;transition:background .2s}
.aipa-btn-white:hover{background:var(--accent-hover);text-decoration:none}
.aipa-btn-ghost{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#2d2d2d;border:1px solid rgba(45,45,45,0.3);border-radius:999px;padding:14px 28px;font-size:16px;font-weight:400;font-family:var(--sans);text-decoration:none;letter-spacing:-0.005em;transition:background .2s}
.aipa-btn-ghost:hover{background:rgba(45,45,45,0.08);text-decoration:none}

@media(max-width:600px){
  .stat-grid,.prog-stats{grid-template-columns:repeat(2,1fr)}
  .nav-tabs{gap:0}
  .nav-btn{padding:5px 8px;font-size:11px}
  nav{flex-wrap:wrap;height:auto;padding:10px 14px;gap:6px}
  .page{padding:110px 18px 56px}
  .section-title{font-size:40px;letter-spacing:-0.022em}
  .section-sub{font-size:18px}
  .aipa-headline-xl{font-size:44px;letter-spacing:-0.022em}
  .aipa-headline-lg{font-size:34px;letter-spacing:-0.018em}
  .aipa-slide{padding:36px 26px}
  .aipa-kpi-val{font-size:46px}
  .aipa-impact-val{font-size:54px}
  .aipa-impact-grid{gap:10px}
  .aipa-outcome-grid{grid-template-columns:1fr}
  .aipa-big-num{font-size:100px}
  .product-grid{grid-template-columns:1fr}
  .prog-hero{padding:44px 28px}
  .prog-hero-title{font-size:44px}
  .aipa-step-title{font-size:30px}
  .aipa-step{padding:30px 24px}
}

/* ════════════════════════════════════════════════════════════════
   BNP — BUILDNATION AIPA BRIEFING DECK (faithful PDF reproduction)
   23 slides · Nunito · yellow / navy / green brand system
   ════════════════════════════════════════════════════════════════ */
.bnp-deck{--bnp-navy:#16324c;--bnp-ink:#1a2b3a;--bnp-green:#1f9d55;--bnp-green-d:#1b7c40;--bnp-maroon:#7c1f2e;--bnp-body:#586977;--bnp-yellow:#f7cf46;
  max-width:1080px;margin:0 auto;font-family:var(--sans)}
.bnp-slide{background:#f7f7f4;border-radius:20px;padding:44px 50px 0;margin-bottom:22px;position:relative;overflow:hidden;
  border:1px solid #ebeae4;box-shadow:0 2px 22px rgba(20,40,60,.05);display:flex;flex-direction:column;min-height:640px}
.bnp-slide-white{background:#fbfbfa}
.bnp-slide-yellow{background:var(--bnp-yellow);border-color:#eabf2e}
.bnp-slide-mint{background:#e9f3e9;border-color:#cfe6cf}
.bnp-slide-body{flex:1 0 auto}
/* type */
.bnp-eyebrow{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--bnp-green);margin-bottom:8px}
.bnp-h1{font-size:74px;font-weight:800;line-height:1.02;letter-spacing:-.03em;color:var(--bnp-navy)}
.bnp-h2{font-size:44px;font-weight:800;line-height:1.06;letter-spacing:-.025em;color:var(--bnp-navy);margin-bottom:6px}
.bnp-h3{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em;color:var(--bnp-navy)}
.bnp-lead{font-size:19px;line-height:1.5;color:var(--bnp-body);font-weight:500}
.bnp-wordmark{position:absolute;top:40px;right:50px;font-size:21px;font-weight:900;letter-spacing:-.04em;color:var(--bnp-navy)}
.bnp-wordmark b{color:var(--bnp-green)}
.bnp-green-txt{color:var(--bnp-green)}
.bnp-navy-txt{color:var(--bnp-navy)}
/* footer strip */
.bnp-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;
  border-top:1px solid rgba(20,40,60,.09);margin-top:26px;padding:12px 0 16px}
.bnp-foot-l{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:#9aa6ae;text-transform:uppercase;line-height:1.6;max-width:70%}
.bnp-foot-r{font-size:14px;font-weight:900;letter-spacing:-.03em;color:var(--bnp-navy);white-space:nowrap}
.bnp-foot-r b{color:var(--bnp-green)}
.bnp-slide-yellow .bnp-foot,.bnp-slide-mint .bnp-foot{border-top-color:rgba(20,40,60,.14)}
.bnp-slide-yellow .bnp-foot{background:#fff;margin:26px -50px 0;padding:12px 50px 16px}
/* card tints */
.bnp-c-green{background:#eaf4ea;border:1px solid #d5e7d5}
.bnp-c-blue{background:#eaf0fa;border:1px solid #d6e2f5}
.bnp-c-cream{background:#fbf3dd;border:1px solid #f1e4b9}
.bnp-c-pink{background:#fbeceb;border:1px solid #f3dad7}
.bnp-c-purple{background:#efeaf8;border:1px solid #ded4ef}
.bnp-c-teal{background:#e7f3ef;border:1px solid #d1e8df}
.bnp-c-plain{background:#fff;border:1px solid #e6e6e0}
/* number badge */
.bnp-badge{width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--bnp-green-d);color:#fff;
  font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
/* green pill */
.bnp-pill{background:var(--bnp-green-d);color:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-size:15px;display:inline-block}
.bnp-pill-ghost{background:#fff;border:1px solid #e2e2da;color:var(--bnp-ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;display:inline-block}
.bnp-pill-out{border:1.4px solid #cfe0d4;color:var(--bnp-green-d);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;display:inline-block}
/* generic grids */
.bnp-g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bnp-g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bnp-g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.bnp-card{border-radius:16px;padding:22px 24px}
.bnp-card-t{font-size:19px;font-weight:800;color:var(--bnp-navy);letter-spacing:-.015em;line-height:1.2}
.bnp-card-d{font-size:14.5px;line-height:1.5;color:var(--bnp-body);font-weight:500}
.bnp-ul{list-style:none;margin:10px 0 0;padding:0}
.bnp-ul li{font-size:14.5px;line-height:1.45;color:var(--bnp-body);font-weight:500;padding:4px 0 4px 16px;position:relative}
.bnp-ul li::before{content:"•";position:absolute;left:0;color:var(--bnp-green-d);font-weight:800}
.bnp-mono-arrow{color:var(--bnp-green-d);font-weight:800}
@media(max-width:820px){
  .bnp-h1{font-size:46px}.bnp-h2{font-size:32px}.bnp-h3{font-size:24px}
  .bnp-slide{padding:30px 24px 0;min-height:0}
  .bnp-wordmark{top:26px;right:24px;font-size:17px}
  .bnp-g2,.bnp-g3,.bnp-g4{grid-template-columns:1fr}
  .bnp-slide-yellow .bnp-foot{margin:22px -24px 0;padding:12px 24px 14px}
}

/* ════════════════════════════════════════════════════════════════
   AI INFERENCE — FULL-SCREEN PRESENTATION DECK
   Each .aipa-slide becomes a viewport-filling, scroll-snapping panel.
   Scoped to body.deck-mode so other pages that reuse .aipa-slide
   (AIPA, FutureMind) keep their normal stacked layout.
   ════════════════════════════════════════════════════════════════ */
body.deck-mode{overflow:hidden}
body.deck-mode footer{display:none}
body.deck-mode #app{height:100vh}
body.deck-mode .page{
  width:100%;max-width:none;margin:0;padding:0;height:100vh;
  overflow-y:scroll;overflow-x:hidden;
  scroll-snap-type:y proximity;scroll-padding-top:48px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
}
/* the standalone page heading is dropped — slide 1 already carries the brand */
body.deck-mode .section-title,
body.deck-mode .section-sub{display:none}
/* each panel fills the window and centres its content */
body.deck-mode .aipa-slide{
  min-height:100vh;margin:0;border-radius:0;
  scroll-snap-align:start;
  display:flex;padding:0;
}
/* margin:auto centres a short panel, but collapses to 0 when a dense
   panel is taller than the viewport — so nothing is ever clipped */
body.deck-mode .aipa-slide-inner{
  margin:auto;width:100%;max-width:1180px;
  padding:84px 7vw 64px;box-sizing:border-box;
}
body.deck-mode .aipa-slide + .aipa-slide{box-shadow:inset 0 1px 0 rgba(0,0,0,0.06)}
/* tighten the largest type so dense panels fit a single screen */
body.deck-mode .aipa-headline-xl{font-size:clamp(34px,5vw,60px)}
body.deck-mode .aipa-headline-lg{font-size:clamp(28px,3.6vw,46px)}
body.deck-mode .aipa-big-num{top:60px}
/* subtle "keep scrolling" cue on the opening panel */
body.deck-mode .aipa-slide:first-of-type .aipa-slide-inner::after{
  content:"";position:absolute;left:50%;bottom:26px;width:22px;height:22px;
  margin-left:-11px;border-right:2px solid rgba(110,231,183,0.7);
  border-bottom:2px solid rgba(110,231,183,0.7);transform:rotate(45deg);
  animation:deckCue 1.8s ease-in-out infinite;pointer-events:none
}
body.deck-mode .aipa-slide:first-of-type{position:relative}
@keyframes deckCue{0%,100%{opacity:.25;transform:translateY(0) rotate(45deg)}50%{opacity:.9;transform:translateY(7px) rotate(45deg)}}
@media(max-width:900px){
  body.deck-mode .page{scroll-padding-top:0}
  body.deck-mode .aipa-slide-inner{padding:96px 22px 60px}
}
@media(max-height:720px){
  body.deck-mode .aipa-slide-inner{padding-top:68px;padding-bottom:44px}
}

/* ════════════════════════════════════════════════════════════════
   NEO-BRUTALIST "CLASSROOM GUIDE" OVERRIDE LAYER
   Cream canvas · Nunito display type · hard offset shadows ·
   thick ink borders · black pill badges · highlighter accents.
   Cascades last so it restyles every page cohesively.
   ════════════════════════════════════════════════════════════════ */
body{
  background:var(--bg);
  font-weight:500;
  letter-spacing:0;
}
/* Subtle paper grain so the cream feels like the printed guide */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%, rgba(217,102,63,0.05), transparent 42%),
    radial-gradient(circle at 88% 82%, rgba(58,107,140,0.05), transparent 42%);
}

/* ── Display type → Nunito, heavy & rounded ── */
.section-title,.sub-label h3,.exp-role,.product-name,.stat-val,.pstat-val,
.format-title,.curr-title,.diff-t,.prog-banner h3,.prog-hero-title,
.aipa-step-title,.prog-sub-title,.prog-phase-title,.prog-impact-val,
.prog-team-name,.prog-cohort-name,.prog-partner-name,.prog-menu-code,
.research-title,.writing-title,.feat-title,.award-title,.contact-val,
.tl-label,.building-title,.dig8-embed-hashtag,.dig8-stat-num,
.aipa-headline-xl,.aipa-headline-lg,.aipa-kpi-val,.aipa-prog-title,
.aipa-phase-title,.aipa-impact-val,.aipa-diff-title,.aipa-team-name,
.aipa-cohort-org,.aipa-outcome-title,.aipa-tech-title,.aipa-big-num,
.aipa-step-num,.aipa-phase-bg,.li-post-name,.prog-result-val,.nav-brand,
.event-title,.event-name,.prod-embed-name{
  font-family:var(--display)!important;
  font-weight:600;
  letter-spacing:0!important;
}
.section-title{font-weight:700;color:var(--ink);text-transform:none}

/* ── NAV → solid cream bar, pill menu, brand wordmark ── */
nav{
  background:var(--bg);
  backdrop-filter:none;-webkit-backdrop-filter:none;
  border-bottom:2.5px solid var(--line);
  height:auto;min-height:54px;padding:8px 18px;
}
.nav-brand{
  font-family:var(--display);font-weight:700;font-size:20px;color:#fff;
  background:var(--ink);border:2.5px solid var(--line);
  border-radius:999px;padding:6px 18px;line-height:1;
  box-shadow:var(--nb-shadow-sm);transition:transform .12s ease,box-shadow .12s ease;
}
.nav-brand:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--shadow-line)}
.nav-btn{
  background:var(--paper);color:var(--ink);
  border:2px solid var(--line);border-radius:999px;
  padding:6px 13px;font-size:12px;font-weight:700;opacity:1;
  margin:3px;transition:transform .12s ease,box-shadow .12s ease,background .12s;
}
.nav-btn:hover{opacity:1;transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--shadow-line)}
.nav-btn.active{background:var(--accent);color:#fff;font-weight:700;box-shadow:2px 2px 0 var(--shadow-line)}
.nav-dropdown-menu{background:var(--paper);border-color:var(--shadow-line)}
.nav-dropdown-item:hover{background:var(--paper-2)}

/* ── Hero treatment (about) ── */
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--ink);color:#fff;border:2.5px solid var(--line);
  border-radius:999px;padding:8px 18px;margin-bottom:18px;
  font-family:var(--display);font-weight:600;font-size:13px;
  letter-spacing:0.04em;text-transform:uppercase;box-shadow:var(--nb-shadow-sm);
}
.hero-eyebrow::before{content:"";width:13px;height:13px;border-radius:50%;border:2px solid #fff}
.hl{
  background:var(--hl);padding:0 .12em;border-radius:4px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;color:var(--ink);
}
.ink-accent{color:var(--accent)}
.ink-blue{color:var(--accent-blue)}
.ink-purple{color:var(--accent-purple)}

/* ── CARDS → thick ink border + hard offset shadow ── */
.card,.stat-box,.exp-card,.product-card,.pstat,.format-card,.curr-card,
.diff-card,.prog-result-card,.aipa-step,.prog-sub-card,.prog-phase-card,
.prog-impact-card,.prog-team-card,.prog-cohort-card,.prog-partner-card,
.prog-menu-card,.uc-menu-card,.event-card,.dig8-embed,.research-card,
.writing-card,.feat-card,.award-card,.contact-card,.building-card,.tl-item,
.notice,.li-post-card,.li-banner,.dig8-feed-banner,.aipa-slide,.aipa-kpi-box,
.aipa-prog-card-dark,.aipa-prog-card-light,.aipa-phase-card,.aipa-impact-card,
.aipa-diff-item,.aipa-team-card,.aipa-cohort-card,.aipa-outcome-card,
.aipa-tech-card,.prod-embed-panel,.contact-card{
  border:2.5px solid var(--line)!important;
  box-shadow:var(--nb-shadow);
  border-radius:var(--radius-lg);
}
/* hover lift → shadow grows toward the page, card nudges into it */
.card:hover,.exp-card:hover,.product-card:hover,.event-card:hover,
.research-card:hover,.writing-card:hover,.feat-card:hover,.award-card:hover,
.contact-card:hover,.building-card:hover,.li-post-card:hover,.stat-box:hover,
.uc-menu-card:hover,.prog-menu-card:hover{
  transform:translate(-3px,-3px)!important;
  box-shadow:6px 6px 0 var(--shadow-line)!important;
}
/* warm default card surfaces */
.stat-box,.pstat,.format-card,.curr-card,.diff-card,.prog-sub-card,
.prog-phase-card,.prog-team-card,.prog-cohort-card,.prog-partner-card,

function toggleServiced(i){
  const panel=document.getElementById('exp-dd-panel-'+i);
  const caret=document.getElementById('exp-dd-caret-'+i);
  if(!panel)return;
  const btn=caret?caret.closest('.exp-dd-toggle'):null;
  const open=panel.classList.toggle('open');
  if(btn)btn.setAttribute('aria-expanded',open?'true':'false');
}

function pageEvents(activeFilter){
  activeFilter = activeFilter || 'All';
  const categories = ['All', ...new Set(EVENTS.map(e=>e.type))];
  const filtered = activeFilter === 'All' ? EVENTS : EVENTS.filter(e=>e.type === activeFilter);

  const filterBtns = categories.map(c=>`
    <button class="event-filter-btn${c===activeFilter?' active':''}" onclick="rerenderEvents('${c}')">${c}</button>`).join('');

  function ytThumb(url){
    const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    return m ? `https://img.youtube.com/vi/${m[1]}/mqdefault.jpg` : null;
  }
  const cards = filtered.map(ev=>{
    const thumb = ytThumb(ev.url||'');
    return `
    <div class="event-card" data-type="${ev.type}">
      ${thumb ? `<a href="${ev.url}" target="_blank" rel="noopener" style="display:block;flex-shrink:0;height:130px;overflow:hidden;position:relative"><img src="${thumb}" alt="${ev.title}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div style="background:rgba(0,0,0,0.55);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 16 16" fill="white"><polygon points="5,2 14,8 5,14"/></svg></div></div></a>` : ''}
      <div class="event-header" style="${thumb?'padding-top:10px':''}">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="event-avatar">HB</div>
          <div><div class="event-name">Hadi Bhuiyan</div><div class="event-date">${ev.date}</div></div>
        </div>
        <span class="event-type">${ev.type}</span>
      </div>
      <div class="event-body">
        <div class="event-title">${ev.title}</div>
        <div class="event-meta">🏢 ${ev.org} · 📍 ${ev.location}</div>
        <p class="event-desc">${ev.desc}</p>
        <div class="chip-row" style="flex-shrink:0;overflow:hidden;max-height:28px">${ev.tags.slice(0,4).map(t=>`<span class="chip">#${t}</span>`).join('')}</div>
        <div class="event-footer" style="margin-top:auto;flex-shrink:0">
          <div class="event-actions">
            <span>👍 Like</span><span>💬 Comment</span><span>↗️ Share</span>
          </div>
          <a href="${ev.url}" target="_blank" class="event-btn">${ev.btnLabel}</a>
        </div>
      </div>
    </div>`}).join('');
  return `
    <h2 class="section-title">Events and News</h2>
    <p class="section-sub">Key appearances, launches, milestones &amp; press coverage</p>
    <div class="event-filter-bar">${filterBtns}</div>

    <div class="li-banner">
      🔗 <span>Drawn from LinkedIn activity, press coverage & official records.</span>
      <a href="http://bd.linkedin.com/in/mahadib/" target="_blank" style="margin-left:auto;color:#1a1a1a;font-weight:800;white-space:nowrap">Follow on LinkedIn →</a>
    </div>
    <div class="event-grid" id="eventGrid">${cards}</div>
    ${activeFilter === 'All' ? newsSectionHTML() : ''}`;
}

function rerenderEvents(filter){
  const pg = document.getElementById('pg-events');
  if(!pg) return;
  pg.innerHTML = pageEvents(filter);
}

    <p class="bnp-lead" style="font-size:15px;margin-bottom:16px;max-width:960px">Derived from the Bangladesh National AI Policy 2026–2030 (Draft v2.0, ICT Division) and aligned with the Bangladesh Bank AI Guideline. Curated by Hadi Bhuiyan for BuildNation and FutureMind AI. These ten principles govern how every AIPA session is scoped, delivered and assessed — each traceable to a clause of the national policy.</p>

        ['07','Anti-Over-Reliance','§5.2','Core human skills — reasoning, writing, problem-solving — are actively protected against erosion by tool dependence.','bnp-c-pink'],

function switchProduct(id){
  document.querySelectorAll('.prod-embed-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.prod-sel-btn').forEach(b=>b.classList.remove('active'));
  const panel = document.getElementById('prod-'+id);
  if(panel){
    panel.classList.add('active');
    const iframe = panel.querySelector('iframe[data-src]');
    if(iframe && !iframe.src) iframe.src = iframe.dataset.src;
  }
  event.currentTarget.classList.add('active');
}

function scrollToSection(sec, btn){
  const el = document.getElementById('sec-'+sec);
  if(el) el.scrollIntoView({behavior:'smooth'});
  document.querySelectorAll('#sections-panel .sp-card').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function updateSectionsPanelVisibility(pageId){
  const panel = document.getElementById('sections-panel');
  if(!panel) return;
  panel.style.display = (pageId === 'about') ? '' : 'none';
}

(function initScrollSpy(){
  const SECS = ['intro','building','timeline','awards','experience'];
  let ticking = false;
  window.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      if(document.querySelector('#sections-panel')?.style.display === 'none'){ticking=false;return;}
      let active = 'intro';
      for(const s of SECS){
        const el = document.getElementById('sec-'+s);
        if(el && el.getBoundingClientRect().top <= 80) active = s;
      }
      document.querySelectorAll('#sections-panel .sp-card').forEach(b=>{
        b.classList.toggle('active', b.dataset.sec === active);
      });
      ticking = false;
    });
  },{passive:true});
})();
