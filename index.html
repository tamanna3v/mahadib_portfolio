function applyPageMeta(id){
  const m = PAGE_META[id] || PAGE_META.about;
  document.title = m.t;
  const desc = document.querySelector('meta[name="description"]');
  if(desc) desc.setAttribute('content', m.d);
  const ogT = document.querySelector('meta[property="og:title"]');
  if(ogT) ogT.setAttribute('content', m.t);
  const ogD = document.querySelector('meta[property="og:description"]');
  if(ogD) ogD.setAttribute('content', m.d);
  const url = 'https://mahadib.futuremind.ltd' + (id === 'about' ? '/' : '/' + id);
  const ogU = document.querySelector('meta[property="og:url"]');
  if(ogU) ogU.setAttribute('content', url);
  let canon = document.querySelector('link[rel="canonical"]');
  if(canon) canon.setAttribute('href', url);
}

function showPage(id, updateHistory = true){
  currentPage = id;
  applyPageMeta(id);
  // render page
  document.getElementById('app').innerHTML = `<div class="page active" id="pg-${id}">${PAGES[id]()}</div>`;
  // presentation-deck mode: AI Inference renders as full-screen, snapping panels
  const deck = (id === 'ai-inference');
  document.body.classList.toggle('deck-mode', deck);
  if(deck) wrapDeckSlides('pg-' + id);
  // update nav
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === id);
  });
  document.querySelectorAll('.nav-dropdown-item').forEach(b=>{
    b.classList.toggle('active', b.dataset.page === id);
  });
  updateSectionsPanelVisibility(id);
  window.scrollTo(0,0);
  // update URL
  if(updateHistory){
    const path = id === 'about' ? '/' : `/${id}`;
    window.history.pushState({ page: id }, '', path);
  }
}

// Wrap each deck panel's content in a centring element so short panels sit
// in the middle of the window while dense panels grow without being clipped.
function wrapDeckSlides(pageElId){
  document.querySelectorAll('#' + pageElId + ' .aipa-slide').forEach(s=>{
    if(s.firstElementChild && s.firstElementChild.classList.contains('aipa-slide-inner')) return;
    const inner = document.createElement('div');
    inner.className = 'aipa-slide-inner';
    while(s.firstChild) inner.appendChild(s.firstChild);
    s.appendChild(inner);
  });
}

// Keyboard navigation for the presentation deck — advance one panel at a time.
document.addEventListener('keydown', (e)=>{
  if(!document.body.classList.contains('deck-mode')) return;
  const next = ['ArrowDown','PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey);
  const prev = ['ArrowUp','PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey);
  if(!next && !prev) return;
  const scroller = document.querySelector('.page');
  if(!scroller) return;
  const slides = [...scroller.querySelectorAll('.aipa-slide')];
  if(!slides.length) return;
  e.preventDefault();
  const base = scroller.getBoundingClientRect().top;
  let idx = 0;
  slides.forEach((s,i)=>{ if(s.getBoundingClientRect().top - base <= 5) idx = i; });
  const target = Math.min(Math.max(idx + (next ? 1 : -1), 0), slides.length - 1);
  slides[target].scrollIntoView({ behavior:'smooth', block:'start' });
});

function getPageFromURL(){
  const path = window.location.pathname;
  if(path === '/' || path === '') return 'about';
  return path.replace(/\//g, '').toLowerCase();
}

window.addEventListener('popstate', (e)=>{
  const page = e.state?.page || getPageFromURL();
  if(PAGES[page]) showPage(page, false);
});

(function init(){
  // build nav
  const tabs = document.getElementById('navTabs');
  NAV.filter(n=>!n.unlisted).forEach(n=>{
    if(n.dropdown){
      const wrap = document.createElement('div');
      wrap.className = 'nav-dropdown';
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.dataset.page = n.id;
      btn.innerHTML = n.text + '<span class="nav-dropdown-arrow">▾</span>';
      btn.onclick = ()=>showPage(n.id);
      wrap.appendChild(btn);
      const menu = document.createElement('div');
      menu.className = 'nav-dropdown-menu';
      n.dropdown.forEach(sub=>{
        const subBtn = document.createElement('button');
        subBtn.className = 'nav-dropdown-item';
        subBtn.dataset.page = sub.id;
        subBtn.textContent = sub.text;
        subBtn.onclick = ()=>showPage(sub.id);
        menu.appendChild(subBtn);
      });
      wrap.appendChild(menu);
      tabs.appendChild(wrap);
    } else {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.dataset.page = n.id;
      btn.textContent = n.text;
      btn.onclick = ()=>showPage(n.id);
      tabs.appendChild(btn);
    }
  });
  // load page from URL or redirect path
  let pageFromURL = getPageFromURL();
  // check if redirected from 404
  const redirectPath = sessionStorage.getItem('redirectPath');
  if(redirectPath){
    sessionStorage.removeItem('redirectPath');
    const redirectPage = redirectPath.replace(/\//g, '').toLowerCase() || 'about';
    if(PAGES[redirectPage]){
      pageFromURL = redirectPage;
      window.history.replaceState({ page: redirectPage }, '', redirectPath);
    }
  }
  const initialPage = PAGES[pageFromURL] ? pageFromURL : 'about';
  showPage(initialPage, false);
})();
